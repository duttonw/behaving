name: Docker Compose Actions Workflow

on:
  push:
  workflow_call:

# Required for https://github.com/mikepenz/action-junit-report/issues/23
permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    name: Python ${{ matrix.python-version }}

    steps:
      # need checkout before using compose-action
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: pip install flake8 pycodestyle

      - name: Check syntax
        run: flake8 .

      - name: Create folders
        run: |
          mkdir -p var/{log,screenshots,mail,sms,gcm,downloads}
          mkdir -p reports
          chmod -R a+rwX var
          chmod -R a+rwX reports

      - uses: isbang/compose-action@v2.4.3

      - name: Test
        run: |
          docker compose exec -T behaving behave --junit tests/features

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "reports/TESTS-*.xml"

      - name: Publish Test Report
        if: always() # always run even if the previous step fails
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/TESTS-*.xml"
          comment: true